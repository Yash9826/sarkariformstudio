<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SarkariFormStudio | Photo, PDF and File Tools for Government Forms</title>
  <meta name="application-name" content="SarkariFormStudio">
  <meta name="description" content="Edit photos and prepare exam files in your browser. Your files stay on your device.">
  <meta property="og:title" content="SarkariFormStudio | Photo, PDF and File Tools for Government Forms">
  <meta property="og:description" content="Edit photos and prepare exam files in your browser. Your files stay on your device.">
  <link id="canonical-url" rel="canonical">

  <script id="route-structured-data" type="application/ld+json"></script>
  <meta name="theme-color" content="#f8f8f5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">

<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="brand">
      <img src="assets/icon.svg" alt="SarkariFormStudio" width="40" height="40">
      <div>
        <span class="brand-name" id="site-name">SarkariFormStudio</span>
        <p id="site-tagline">Photo, PDF &amp; file tools for forms</p>
      </div>
    </div>
    <div id="navigation-host" class="navigation-host"></div>
    <div class="header-actions">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
        <span class="theme-icon" aria-hidden="true">☾</span><span class="theme-label">Dark</span>
      </button>
    </div>
  </header>

  <main id="main">
    <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb"></nav>
    <section id="page-content" class="page-content"></section>
    <section id="panel-exam" data-app-panel="exam" aria-label="Exam photo resizer" hidden></section>
    <section id="panel-general" data-app-panel="general" aria-label="Custom size cropper" hidden></section>
    <section id="panel-check" data-app-panel="check" aria-label="File checker" hidden></section>
    <section id="panel-tools" data-app-panel="tools" aria-label="Tools hub" hidden></section>
    <section id="panel-photo-editor" data-app-panel="photo-editor" aria-label="Photo editor" hidden></section>
    <noscript><p class="fatal">SarkariFormStudio needs JavaScript to resize pictures in your browser. Please enable it and reload.</p></noscript>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <footer>
    <nav id="footer-links" class="footer-links" aria-label="Information pages"></nav>
    <p id="footer-disclaimer">Not affiliated with any government body or exam authority.</p>
  </footer>
